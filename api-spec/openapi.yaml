openapi: 3.1.0

info:
  title: OpenAgenda API
  version: '3.0.0-draft'
  description: |
    The OpenAgenda v3 API gives programmatic access to agendas, events and
    locations. This contract is the single source of truth behind the generated
    SDK, the MCP server and this reference.

    ## Authentication

    Every request is authenticated with `Authorization: Bearer <token>`, using
    one of two credentials (the only exception is `POST /uploads/staged`, which
    is authorized by an upload ticket in the `X-Upload-Ticket` header):

    - **API key** — a read-only public key (`oa_pk_…`), which carries no
      user identity and reads what is public, or a secret key (`oa_sk_…`) for
      reads and writes. Best for server-to-server and scripts.
    - **OAuth 2.1** — authorization-code flow with mandatory PKCE (`S256`) for
      interactive apps acting on a user's behalf. The issued short-lived token
      carries the granted scopes (`agendas:read`, `events:read`, …). Public
      clients hold no secret.

    Use the **Authentication** selector at the top of this page to try requests
    with any of these credentials directly from the browser.

    ## Pagination

    List endpoints are **cursor-paginated**. Read `pagination.after` from a
    response and pass it back as the `after` query parameter to fetch the next
    page, with the same filters.

    ## Responses

    A field a response schema marks required is always present unless `fields`
    narrows the response: an empty array is `[]`, an empty localized map is
    `{}`, and an absent value is `null`.

    ## SDK & MCP

    - **TypeScript SDK** — [`@openagenda/api-client`](https://www.npmjs.com/package/@openagenda/api-client),
      generated from this contract.
    - **MCP server** — [`mcp.openagenda.com`](https://mcp.openagenda.com)
      exposes the same surface to AI agents over the Model Context Protocol.
  contact:
    name: OpenAgenda Support
    email: support@openagenda.com
    url: https://developers.openagenda.com
  license:
    name: Proprietary — © OpenAgenda
    identifier: LicenseRef-OpenAgenda-Proprietary
  # SDK-first story: the code samples on each operation use @openagenda/api-client
  # (generated from this very contract). Surface its install up front.
  x-scalar-sdk-installation:
    - lang: TypeScript
      description: |
        Install the official, fully-typed TypeScript SDK, generated from this
        contract:

        ```sh
        npm install @openagenda/api-client
        ```

        Every operation's code sample uses it.

servers:
  - url: https://api.openagenda.com/v3
    description: Production
  - url: https://dapi.openagenda.com/v3
    description: Development

tags:
  - name: Agendas
    description: >
      Agendas hold and publish events. List and inspect them, then drill into
      the events they publish.
  - name: Events
    description: Events published in an agenda.
  - name: Locations
    description: >
      Where events happen. Each agenda has its own pool of locations —
      or shares one with other agendas through a location set.
  - name: Me
    description: >
      The authenticated caller: the agendas they are a member of and their
      role on each. Requires a user identity — a secret key or an OAuth
      token; a public (`oa_pk_…`) key carries no identity and answers
      `401`.
  - name: Uploads
    description: >
      Stage a media file (the native event image, or a custom file/image
      field) as `multipart/form-data`, then attach it by reference on an event
      write — so the media lands in the same write as the rest of the edit. The
      API validates the file's real type and size before storing it.

# Groups the resource tags under a "Resources" heading in the Scalar sidebar.
# Forward-compatible with the upcoming members surface (see scopes).
x-tagGroups:
  - name: Resources
    tags:
      - Agendas
      - Events
      - Locations
      - Me
      - Uploads

# Authenticate every request with either an API key or an OAuth2 token,
# both carried as `Authorization: Bearer <token>`.
security:
  - oauth2:
      - events:read
  - secretKey: []
  - publicKey: []

paths:
  /agendas:
    get:
      operationId: agendas.list
      tags: [Agendas]
      summary: List agendas
      x-synonyms: [calendars, directory, catalogue, catalog, browse, find, all]
      x-codeSamples:
        - lang: TypeScript
          label: List official agendas
          source: |
            const { data, error } = await oa.agendas.list({
              query: { official: true, limit: 20 },
            });
            if (error) throw error;
            return data.data.map((a) => ({ uid: a.uid, title: a.title }));
      description: >
        Returns a cursor-paginated list of agendas. Pass the `after`
        cursor returned in `pagination.after` to fetch the next page,
        with the same filters.


        Unknown or malformed filter values answer `400`, with per-field
        context under `error.errors`. An unrecognized top-level query parameter
        is ignored.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - agendas:read
      parameters:
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Detailed'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/AgendaSearch'
        - $ref: '#/components/parameters/AgendaSort'
        - $ref: '#/components/parameters/AgendaFilterUid'
        - $ref: '#/components/parameters/AgendaFilterSlug'
        - $ref: '#/components/parameters/AgendaFilterOfficial'
      responses:
        '200':
          description: A page of agendas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /agendas/{agendaUid}:
    get:
      operationId: agendas.get
      tags: [Agendas]
      summary: Get one agenda
      x-synonyms:
        [calendar, detail, single, one, by id, uid, fetch, retrieve, lookup]
      x-codeSamples:
        - lang: TypeScript
          label: Get one agenda by uid
          source: |
            const { data, error } = await oa.agendas.get({
              path: { agendaUid: 12345 },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a single agenda in its full `Agenda` representation. An
        unknown agenda uid answers `404`.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - agendas:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agenda'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agendas/{agendaUid}/overview:
    get:
      operationId: agendas.overview
      tags: [Agendas]
      summary: Get an agenda's activity overview
      x-synonyms:
        [summary, stats, statistics, metrics, counts, activity, dashboard, kpi]
      x-codeSamples:
        - lang: TypeScript
          label: Overview of one agenda
          source: |
            const { data, error } = await oa.agendas.overview({
              path: { agendaUid: 12345 },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a live activity overview of the agenda: event volume,
        distributions (by language, source, end-day…), spatial viewport and
        thematic keywords.


        Two visibility scopes. `events.published` (publicly visible events) is
        returned to every caller. `events.all` (events of any moderation state,
        moderation/refused included) is returned ONLY to
        `administrator|moderator|internal` callers and is absent otherwise.
        Computed on each request.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - events:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      responses:
        '200':
          description: The agenda overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agendas/{agendaUid}/events:
    get:
      operationId: agendas.events.list
      tags: [Events]
      summary: List events of an agenda
      x-synonyms:
        [find, browse, filter, paginate, cursor, upcoming, when, where, date]
      x-codeSamples:
        - lang: TypeScript
          label: All upcoming events in Paris (paging every result)
          source: |
            const events = [];
            let after;
            do {
              const { data, error } = await oa.agendas.events.list({
                path: { agendaUid: 12345 },
                query: { city: ['Paris'], relative: ['upcoming'], limit: 100, after },
              });
              if (error) throw error;
              events.push(...data.data);
              after = data.pagination.after;
            } while (after);
            return events.length;
      description: >
        Returns a cursor-paginated list of events for the given agenda. Pass
        the `after` cursor returned in `pagination.after` to fetch the next
        page, with the same filters.


        Only published events are listed. Unknown or malformed filter values answer `400`, with per-field
        context under `error.errors`. An unrecognized top-level query parameter
        is ignored.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - events:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Detailed'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Sort'
        # text & identity
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/RelevanceThreshold'
        - $ref: '#/components/parameters/FilterUid'
        - $ref: '#/components/parameters/FilterSlug'
        - $ref: '#/components/parameters/FilterExtId'
        # classification
        - $ref: '#/components/parameters/FilterKeyword'
        - $ref: '#/components/parameters/FilterLanguage'
        - $ref: '#/components/parameters/FilterAccessibility'
        - $ref: '#/components/parameters/FilterStatus'
        - $ref: '#/components/parameters/FilterAttendanceMode'
        - $ref: '#/components/parameters/FilterFeatured'
        # place
        - $ref: '#/components/parameters/FilterLocationUid'
        - $ref: '#/components/parameters/FilterLocationExtId'
        - $ref: '#/components/parameters/FilterRegion'
        - $ref: '#/components/parameters/FilterDepartment'
        - $ref: '#/components/parameters/FilterCity'
        - $ref: '#/components/parameters/FilterDistrict'
        - $ref: '#/components/parameters/FilterAdminLevel3'
        - $ref: '#/components/parameters/FilterAdminLevel5'
        - $ref: '#/components/parameters/FilterCountryCode'
        - $ref: '#/components/parameters/FilterBoundingBox'
        - $ref: '#/components/parameters/FilterNear'
        - $ref: '#/components/parameters/FilterRadius'
        # provenance
        - $ref: '#/components/parameters/FilterOriginAgendaUid'
        - $ref: '#/components/parameters/FilterOriginAgendaOfficial'
        - $ref: '#/components/parameters/FilterSourceAgendaUid'
        # time
        - $ref: '#/components/parameters/FilterRelative'
        - $ref: '#/components/parameters/FilterTimings'
        - $ref: '#/components/parameters/FilterLocalTime'
        - $ref: '#/components/parameters/FilterCreatedAt'
        - $ref: '#/components/parameters/FilterUpdatedAt'
        # audience & additional fields
        - $ref: '#/components/parameters/FilterAge'
        - $ref: '#/components/parameters/FilterAdditionalFields'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: agendas.events.create
      tags: [Events]
      summary: Create an event
      x-synonyms: [add, new, create, publish, post, submit, insert]
      x-codeSamples:
        - lang: TypeScript
          label: Create an event with an agenda-specific additional field
          source: |
            const { data, error } = await oa.agendas.events.create({
              path: { agendaUid: 12345 },
              body: {
                title: { fr: 'Concert de jazz', en: 'Jazz concert' },
                description: { fr: 'Une soirée jazz.', en: 'A jazz evening.' },
                timings: [
                  { begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' },
                ],
                location: { uid: 55512 },
                additionalFields: { myCustomField: 'value' },
              },
            });
            if (error) throw error;
            return data;
      description: >
        Creates an event in the given agenda and returns the created
        `Event`, with a `Location` header pointing at its canonical
        by-uid URL.


        Native writable fields sit at the top level; agenda-specific
        fields go under `additionalFields`; any other top-level key is
        rejected with `400`. The moderation `state` of the created
        event is arbitrated by the caller's role and the agenda's
        contribution settings - a contributor's event may be created
        pending moderation rather than published.


        The acting member must be allowed to create events in this
        agenda, otherwise `403`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: The created event.
          headers:
            Location:
              description: Canonical by-uid URL of the created event.
              required: true
              schema:
                type: string
              example: /agendas/12345/events/9876543
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /agendas/{agendaUid}/events/validate:
    post:
      operationId: agendas.events.validate
      tags: [Events]
      summary: Validate an event without creating it
      x-synonyms: [dry run, check, validate, preview, lint, verify]
      x-codeSamples:
        - lang: TypeScript
          label: Dry-run validate an event body before creating it
          source: |
            const { data, error } = await oa.agendas.events.validate({
              path: { agendaUid: 12345 },
              body: {
                title: { fr: 'Concert de jazz' },
                description: { fr: 'Une soirée jazz.' },
                timings: [
                  { begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' },
                ],
                location: { uid: 55512 },
              },
            });
            if (error) throw error; // 422 with error.errors when invalid
            return data.valid; // true
      description: >
        Validates the body exactly as create does, without persisting
        anything. A well-formed, valid body answers `200 { "valid":
        true }`; invalid field values answer `422` with per-field
        problems under `error.errors[]`. Structural body
        problems (an unknown top-level key, an `additionalFields` name
        colliding with a native field) answer `400`.


        A native `image: { url }` is checked for URL syntax only (an
        `http(s)` URL without embedded credentials): the URL is not
        fetched, so a URL that create rejects with `422` at fetch time
        (unreachable host, private address, over 20 MiB, not an image)
        passes validate. The image counts as present, so an agenda
        whose schema requires one validates as it would create.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: The body is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationVerdict'
              example:
                valid: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /agendas/{agendaUid}/events/{eventUid}:
    get:
      operationId: agendas.events.get
      tags: [Events]
      summary: Get a single event
      x-synonyms: [detail, single, one, by id, uid, fetch, retrieve, lookup]
      x-codeSamples:
        - lang: TypeScript
          label: Get a single event within an agenda
          source: |
            const { data, error } = await oa.agendas.events.get({
              path: { agendaUid: 12345, eventUid: 67890 },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a single event by its uid within the given agenda. An unknown
        event uid answers `404`.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - events:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/EventUid'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: agendas.events.update
      tags: [Events]
      summary: Replace an event
      x-synonyms: [update, replace, edit, put, overwrite, modify]
      x-codeSamples:
        - lang: TypeScript
          label: Replace an event's content
          source: |
            const { data, error } = await oa.agendas.events.update({
              path: { agendaUid: 12345, eventUid: 67890 },
              body: {
                title: { fr: 'Concert de jazz', en: 'Jazz concert' },
                description: { fr: 'Une soirée jazz.', en: 'A jazz evening.' },
                timings: [
                  { begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' },
                ],
                location: { uid: 55512 },
              },
            });
            if (error) throw error;
            return data;
      description: >
        Replaces the event's content with the submitted body and
        returns the updated `Event`. A full write: the server-side
        requirements of create apply. Use `PATCH` to change only a few
        fields.


        External id mappings (`extIds`) in the body are merged by key
        with the stored ones; pass `?mergeExtIds=false` to replace them
        wholesale.


        The acting member must be allowed to edit this event's
        content, otherwise `403`. An unknown event uid answers `404`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/EventUid'
        - $ref: '#/components/parameters/MergeExtIds'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      operationId: agendas.events.patch
      tags: [Events]
      summary: Partially update an event
      x-synonyms: [patch, partial update, edit, modify, change]
      x-codeSamples:
        - lang: TypeScript
          label: Change just the event's title
          source: |
            const { data, error } = await oa.agendas.events.patch({
              path: { agendaUid: 12345, eventUid: 67890 },
              body: { title: { fr: 'Nouveau titre', en: 'New title' } },
            });
            if (error) throw error;
            return data;
      description: >
        Updates only the fields present in the body (an `EventPatch`)
        and returns the updated `Event`. Fields left out are unchanged;
        `extIds` present in the body are merged by key with the stored
        ones.


        The acting member must be allowed to edit this event's
        content, otherwise `403`. An unknown event uid answers `404`,
        invalid field values `422`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/EventUid'
        - $ref: '#/components/parameters/MergeExtIds'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: agendas.events.delete
      tags: [Events]
      summary: Delete an event
      x-synonyms: [delete, remove, destroy, cancel, drop]
      x-codeSamples:
        - lang: TypeScript
          label: Delete an event
          source: |
            const { data, error } = await oa.agendas.events.delete({
              path: { agendaUid: 12345, eventUid: 67890 },
            });
            if (error) throw error;
            return data.deleted; // true
      description: >
        Removes the event from this agenda. When the agenda is the
        event's origin this deletes the event; otherwise it
        de-references it from this agenda (the origin keeps it). Answers
        `200` with a `DeletionResult` carrying the removed event's uid.


        The acting member must be allowed to remove the event,
        otherwise `403`. An unknown event uid answers `404`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/EventUid'
      responses:
        '200':
          description: The event was removed from this agenda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agendas/{agendaUid}/events/ext/{extKey}/{extId}:
    get:
      operationId: agendas.events.getByExtId
      tags: [Events]
      summary: Get a single event by external id
      x-synonyms: [ext, external id, by ext, sync, source id, lookup, resolve]
      x-codeSamples:
        - lang: TypeScript
          label: Resolve an event by the id it carries in a sync source
          source: |
            const { data, error } = await oa.agendas.events.getByExtId({
              path: { agendaUid: 12345, extKey: 'my-system', extId: 'abc-123' },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a single event by its external identifier within the given
        agenda - the `(key, value)` pair an `ExtId` mapping carries in the
        event's `extIds`. Use this when you sync from your own system and hold
        its id rather than the OpenAgenda uid. Resolves to the same `Event` as
        the by-uid get; an unknown pair answers `404`.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - events:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/ExtKey'
        - $ref: '#/components/parameters/ExtIdValue'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: agendas.events.setByExtId
      tags: [Events]
      summary: Upsert an event by external id (replace)
      x-synonyms: [upsert, sync, set, put, replace, import, by ext]
      x-codeSamples:
        - lang: TypeScript
          label: Upsert an event addressed by its id in a sync source
          source: |
            const { data, error } = await oa.agendas.events.setByExtId({
              path: { agendaUid: 12345, extKey: 'my-system', extId: 'abc-123' },
              body: {
                title: { fr: 'Concert de jazz', en: 'Jazz concert' },
                description: { fr: 'Une soirée jazz.', en: 'A jazz evening.' },
                timings: [
                  { begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' },
                ],
                location: { uid: 55512 },
              },
            });
            if (error) throw error;
            return data;
      description: >
        Upserts the event carrying the `(extKey, extId)` pair: its
        content is REPLACED if it already exists (`200`), or the event
        is CREATED if not (`201` + a `Location` header pointing at its
        canonical by-uid URL). The path pair is authoritative - it is
        added to the event's `extIds`, keeping the mappings from other
        systems, so the event always carries its own external identity;
        any `extIds` in the body are ignored. This is the recommended
        write path for syncing from your own system: it is idempotent
        by external identity, so a lost response can be retried without
        creating a duplicate.


        The acting member must be allowed to create or edit the event,
        otherwise `403`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/ExtKey'
        - $ref: '#/components/parameters/ExtIdValue'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: The existing event was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '201':
          description: A new event was created.
          headers:
            Location:
              description: Canonical by-uid URL of the created event.
              required: true
              schema:
                type: string
              example: /agendas/12345/events/9876543
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      operationId: agendas.events.patchByExtId
      tags: [Events]
      summary: Upsert an event by external id (partial)
      x-synonyms: [upsert, sync, patch, partial, merge, by ext]
      x-codeSamples:
        - lang: TypeScript
          label: Partially upsert an event addressed by its sync id
          source: |
            const { data, error } = await oa.agendas.events.patchByExtId({
              path: { agendaUid: 12345, extKey: 'my-system', extId: 'abc-123' },
              body: { title: { fr: 'Nouveau titre', en: 'New title' } },
            });
            if (error) throw error;
            return data;
      description: >
        Upserts the event carrying the `(extKey, extId)` pair. When it
        already exists, only the fields present in the body (an
        `EventPatch`) are changed - the rest is left untouched (`200`).
        If no event carries the pair it is created (`201` + a
        `Location` header pointing at its canonical by-uid URL), in
        which case the full server-side requirements apply, so the body
        must be complete enough to create a valid event (else `422`).
        The path pair is added to the event's `extIds`, keeping the
        mappings from other systems; any `extIds` in the body are
        ignored.


        The acting member must be allowed to create or edit the event,
        otherwise `403`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/ExtKey'
        - $ref: '#/components/parameters/ExtIdValue'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '200':
          description: The existing event was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '201':
          description: A new event was created.
          headers:
            Location:
              description: Canonical by-uid URL of the created event.
              required: true
              schema:
                type: string
              example: /agendas/12345/events/9876543
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
