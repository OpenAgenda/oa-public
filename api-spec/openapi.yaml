    MeAgendaList:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          description: >
            `MeAgendaItem` items by default, or `MeAgendaItemDetailed` items
            when `detailed=true`.
          items:
            # Detailed branch first — see LocationList for why.
            oneOf:
              - $ref: '#/components/schemas/MeAgendaItemDetailed'
              - $ref: '#/components/schemas/MeAgendaItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Timing:
      type: object
      description: One occurrence of an event.
      required: [begin, end]
      additionalProperties: false
      properties:
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        id:
          type: string
          pattern: '^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{6}$'
          description: >
            Stable identifier of this occurrence, kept across writes so a link
            to a single date keeps working when the event is edited. Absent
            (rather than `null`) when none has been assigned. The server never
            moves a stored `id` to another occurrence; an occurrence it cannot
            match to a stored one receives a fresh `id`. Supplied on write, it
            is stored as sent and names that occurrence; a value repeated within
            the submitted timings is kept on the first occurrence only. A
            supplied `id` that does not match the pattern answers `422`.
        sourceRef:
          type: string
          maxLength: 255
          description: >
            Your own key for this occurrence, opaque to OpenAgenda and stored as
            sent. On a resync, an occurrence carrying the same `sourceRef` keeps
            its `id` even when its dates moved, which is how a connector holds
            on to an occurrence it has already published. Two occurrences of
            the same event sharing a `sourceRef` are both treated as new.

    OffersAggregate:
      type: [object, 'null']
      additionalProperties: false
      description: >
        What the ticketing sources of this event add up to, computed on each
        read. `availability` is `null` when nothing can be said - every
        occurrence past, or no source carrying a usable status - and reflects
        the current time, except `soldOut` and `limited`, which reflect the last
        sync with the provider. `pricing` is a category rolled up from the
        sources' price lists and declared pricing.
      properties:
        availability:
          type: [string, 'null']
          enum:
            [
              available,
              limited,
              notYetOnSale,
              soldOut,
              salesClosed,
              unknown,
              mixed,
              null,
            ]
          description: >
            `mixed` means the occurrences disagree — one date sold out, another
            closed — and is a real answer rather than a failure to decide: a
            consumer should render it as "see dates".
        pricing:
          type: [string, 'null']
          enum: [free, paid, donation, mixed, unknown, null]
          description: >
            A category, never an amount. `mixed` means the sources or the
            occurrences disagree (one date free, another paid); `unknown` means
            no source carries a usable pricing.

    AgeRange:
      type: [object, 'null']
      description: The audience age an event addresses.
      additionalProperties: false
      properties:
        min:
          type: [integer, 'null']
        max:
          type: [integer, 'null']

    Accessibility:
      type: [object, 'null']
      description: >
        Per-facility accessibility flags — `true` when the event offers that
        facility. The keys are the `AccessibilityCode` values.
      additionalProperties: false
      properties:
        hi:
          type: boolean
          description: Hearing impairment.
        ii:
          type: boolean
          description: Intellectual impairment.
        vi:
          type: boolean
          description: Visual impairment.
        pi:
          type: boolean
          description: Psychic impairment.
        mi:
          type: boolean
          description: Motor impairment.

    Registration:
      type: object
      description: A single way for attendees to register.
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [phone, email, link]
        value:
          type: string

    EnrichedLink:
      type: object
      additionalProperties: false
      properties:
        link:
          type: string
          format: uri
        data:
          type: object
          description: Optional enrichment metadata extracted from the link.
          additionalProperties: true

    ImageRef:
      type: object
      description: >
        A lightweight image for an embedded reference (an agenda logo on an
        event's originAgenda/sourceAgendas, or a provenance facet bucket): a
        ready-to-use `src` plus the `{geo}` template. The agenda's own `image`
        carries the full `Image`.
      additionalProperties: false
      required: [src, srcTemplate]
      properties:
        src:
          type: [string, 'null']
          format: uri
          description: >
            A ready-to-use default rendition URL (a modest proportional width) —
            a naive `<img src>` just works.
        srcTemplate:
          type: [string, 'null']
          description: >
            A URL with a literal `{geo}` placeholder to substitute with a
            geometry, to render the ref image at any size. Supported geometries:
            `{W}x{H}`, where `0` on an axis means proportional to the other
            (e.g. `800x0`); append `/smart` to crop on the detected point of
            interest rather than the centre, or prefix `fit-in/` to contain the
            image instead of cropping it. `null` when no rendition can be
            derived - use `src` as is.

    AgendaRef:
      type: object
      description: A compact reference to an agenda.
      additionalProperties: false
      properties:
        uid:
          type: integer
          format: int64
        title:
          type: [string, 'null']
        slug:
          type: [string, 'null']
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        url:
          type: [string, 'null']
          format: uri
        official:
          type: [boolean, 'null']

    SourceAgendaRef:
      type: object
      description: >
        A source-agenda reference as carried by provenance facet buckets.
      additionalProperties: false
      required: [uid]
      properties:
        uid:
          type: integer
          format: int64
        title:
          type: [string, 'null']
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    ExtId:
      type: object
      description: An external identifier mapping this event to a third-party system.
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string

    AdditionalFields:
      type: object
      description: >
        Agenda-specific additional fields. The available keys and the shape of
        each value are defined by the agenda's event form schema
        (`GET /agendas/{agendaUid}/events/schema`): each value follows its
        field's `fieldType`.


        A `file`/`image` field is set by reference, like the native image:
        stage the bytes via `POST /agendas/{uid}/uploads`, then send
        `{ ref, name? }` here (`name` is the original filename, used for the
        download; optional), or `null` to clear it. On read the same field
        returns the stored descriptor `{ originalName, extension, filename }`,
        where `filename` is the stored object's key; the API does not return its
        absolute URL.
      additionalProperties:
        x-additionalPropertiesName: fieldName

    AgendaNetworkRef:
      type: [object, 'null']
      description: A compact reference to the network an agenda belongs to, or `null`.
      additionalProperties: false
      required: [uid, title]
      properties:
        uid:
