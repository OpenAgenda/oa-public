    UploadTicket:
      type: object
      additionalProperties: false
      required: [ref, expiresAt]
      description: >
        A staged upload. Attach `ref` on an event write (`image`, or a custom
        file/image field under `additionalFields`) before it expires.
      properties:
        ref:
          type: string
          description: The staging reference to attach on an event write.
        expiresAt:
          type: string
          format: date-time
          description: >
            The staged upload is attachable at least until this instant (ISO
            8601); attaching it later may answer `422`.

    UploadDescriptor:
      type: object
      additionalProperties: false
      required: [uploadUrl, method, header, field, ticket, maxBytes, expiresAt]
      description: >
        An out-of-band upload authorization. `POST` the raw file to `uploadUrl`
        with a plain HTTPS request, sending `ticket` in the `header` header and
        the file as multipart `field`. That call returns an `UploadTicket`
        whose `ref` you attach with `image: { ref }`.
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Absolute URL to POST the file to (out of band).
        method:
          type: string
          description: The HTTP method to use for the upload (`POST`).
        header:
          type: string
          description: The header carrying the `ticket` (`X-Upload-Ticket`).
        field:
          type: string
          description: The multipart form field for the file (`file`).
        ticket:
          type: string
          description: >
            The single-use capability ticket. Upload-only, bound to this agenda,
            one file, short-lived; carries no account credential.
        maxBytes:
          type: integer
          description: Maximum accepted file size, in bytes.
        expiresAt:
          type: string
          format: date-time
          description: When the ticket expires (ISO 8601).

    ImageInput:
      description: >
        Write shape for an event image (the read `Image` carries the rendition
        URLs). Attach the image one of two ways - a freshly-staged upload by
        its `ref` (the value returned by `POST /agendas/{uid}/uploads`), or a
        publicly reachable `url` the server fetches - or send `null` to remove
        the current image. The image is stored as part of the same write as
        the rest of the edit; renditions are derived from it on demand.


        The `url` must be a publicly reachable `http(s)` image, without
        credentials in the URL. A URL that is malformed, not `http(s)`, carries
        credentials, is not publicly reachable, cannot be retrieved, is not a
        valid image, or is larger than 20 MiB is rejected with `422`.


        An object carrying both `ref` and `url`, or any other key, is rejected
        with `400`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref:
              type: string
              description: >
                A staging reference returned by the upload endpoint (of the form
                `staging/{agendaUid}/…`). It must belong to this agenda - a
                reference for another agenda answers `422` - and be attached
                before the upload's `expiresAt`; attaching it later may answer
                `422`.
        - type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
              format: uri
              maxLength: 2048
              description: >
                A publicly reachable `http(s)` image URL, without embedded
                credentials. The server retrieves it and stores it like a staged
                upload.
        - type: 'null'

    EventInput:
      type: object
      description: >
        Request body for creating or replacing an event: the fields a client
        may set. Agenda-specific fields go under `additionalFields`, never at
        the top level; any other top-level key (a read-only field such as
        `uid` or `slug`, an unknown name) is rejected with `400`, as is an
        `additionalFields` name that collides with a native field. Field
        values are validated by the server (a `422` with per-field
        `error.errors[]` on failure).


        Required fields depend on the target agenda: an event needs at least
        `title`, `description` and `timings`, plus a `location` unless it is
        online-only, plus whatever the agenda marks required; a missing one
        answers `422` with the per-field set under `error.errors[]`.


        The `image` is set either by reference - stage the bytes via `POST
        /agendas/{uid}/uploads` and pass the returned `ref` here - or by a
        public `url` the server fetches (or `null` to clear it). An event's
        privacy is derived from its agenda.
      additionalProperties: false
      properties:
        title:
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
          description: >
            When the event is created, its `slug` is derived from this title,
            preferring the language that comes first in the request body. Put
            the event's original language first.
        description:
          $ref: '#/components/schemas/LocalizedString'
        longDescription:
          $ref: '#/components/schemas/LocalizedString'
        conditions:
          $ref: '#/components/schemas/LocalizedString'
        keywords:
          $ref: '#/components/schemas/LocalizedStringArray'
        timings:
          type: array
          description: >
            The event's occurrences. Required for a publishable event; the
            server enforces the exact requirement for the target agenda.
          items:
            $ref: '#/components/schemas/Timing'
        location:
          description: >
            The event's location, referenced by its uid; a uid that matches no
            location answers `422`.
          oneOf:
            - $ref: '#/components/schemas/EventLocationRef'
            - type: 'null'
        attendanceMode:
          $ref: '#/components/schemas/AttendanceMode'
        onlineAccessLink:
          type: [string, 'null']
          format: uri
          description: >
            Access link for an online or hybrid event (`attendanceMode` `2` or
            `3`).
        accessibility:
          $ref: '#/components/schemas/Accessibility'
        age:
          $ref: '#/components/schemas/AgeRange'
        registration:
          type: array
          description: >
            Ways for attendees to register; an invalid entry answers `422`.
          items:
            $ref: '#/components/schemas/Registration'
        extIds:
          type: array
          description: >
            External identifiers mapping this event to your own system(s). Use
            these to resolve the event later via the by-ext-id endpoints.
          items:
            $ref: '#/components/schemas/ExtId'
        state:
          allOf:
            - $ref: '#/components/schemas/ModerationState'
          description: >
            Moderation state, arbitrated by the server. A moderator or
            administrator's value is applied; requesting `2` (published)
            without publish permission answers `403`. For other members, on
            creation the value is ignored and the agenda's default contribution
            state applies; on update, the agenda's moderation settings decide
            whether the existing state is kept or reset to `0` (to control).
            Omit it to let the agenda's settings decide.
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          description: >
            Event lifecycle status. Accepted only on agendas that have the event
            status feature enabled; otherwise sending it answers `422`.
        image:
          $ref: '#/components/schemas/ImageInput'
        imageCredits:
          type: [string, 'null']
          maxLength: 255
          description: >
            Credits for the event `image`. Ignored when the event has no image;
            `null` clears them.
        additionalFields:
          $ref: '#/components/schemas/AdditionalFields'

    EventPatch:
      type: object
      description: >
        Partial update body: every field is optional, and only the provided
        fields are changed.
      additionalProperties: false
      properties:
        title:
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
          description: >
            When the event is created, its `slug` is derived from this title,
            preferring the language that comes first in the request body. Put
            the event's original language first.
        description:
          $ref: '#/components/schemas/LocalizedString'
        longDescription:
          $ref: '#/components/schemas/LocalizedString'
        conditions:
          $ref: '#/components/schemas/LocalizedString'
        keywords:
          $ref: '#/components/schemas/LocalizedStringArray'
        timings:
          type: array
          items:
            $ref: '#/components/schemas/Timing'
        location:
          oneOf:
            - $ref: '#/components/schemas/EventLocationRef'
            - type: 'null'
        attendanceMode:
          $ref: '#/components/schemas/AttendanceMode'
        onlineAccessLink:
          type: [string, 'null']
          format: uri
        accessibility:
          $ref: '#/components/schemas/Accessibility'
        age:
          $ref: '#/components/schemas/AgeRange'
        registration:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
        extIds:
          type: array
          items:
            $ref: '#/components/schemas/ExtId'
        state:
          allOf:
            - $ref: '#/components/schemas/ModerationState'
          description: >
            Moderation state, arbitrated by the server. A moderator or
            administrator's value is applied; requesting `2` (published)
            without publish permission answers `403`. For other members, the
            agenda's moderation settings decide whether the existing state is
            kept or reset to `0` (to control).
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          description: >
            Event lifecycle status. Accepted only on agendas that have the event
            status feature enabled; otherwise sending it answers `422`.
        image:
          $ref: '#/components/schemas/ImageInput'
        imageCredits:
          type: [string, 'null']
          maxLength: 255
          description: >
            Credits for the event `image`. Ignored when the event has no image;
            `null` clears them.
        additionalFields:
          $ref: '#/components/schemas/AdditionalFields'

    EventLocationRef:
      type: object
      description: A reference to an existing location by its OpenAgenda uid.
