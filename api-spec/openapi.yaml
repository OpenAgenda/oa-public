    AgendaList:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          description: >
            `AgendaSummary` items by default, or `AgendaDetailed` items when
            `detailed=true`.
          items:
            # Detailed branch first — see LocationList for why.
            oneOf:
              - $ref: '#/components/schemas/AgendaDetailed'
              - $ref: '#/components/schemas/AgendaSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # The two visibility scopes of an agenda's events share a metric vocabulary
    # (scalar totals, `by<Dimension>` maps of `key → count`, a spatial `viewport`,
    # a thematic `keywords` list) but are DISTINCT schemas, each fully-required so
    # the SDK types every field as present (not `T | undefined`). They differ only
    # by their scope-specific keys: `published` carries the exact distinct counts
    # `locations`/`creators`; `all` carries the per-moderation-state `byState`.
    # The whole `all` scope is the single optional — it is gated by access (see
    # AgendaOverview), so a consumer reasons about its presence from the access it
    # holds, while every field WITHIN a returned scope is guaranteed.
    PublishedEventStats:
      type: object
      additionalProperties: false
      description: >
        Statistics over an agenda's **publicly visible** events
        (`events.published`), including the exact distinct counts `locations`
        and `creators`.
      required:
        - total
        - locations
        - creators
        - timeline
        - byLanguage
        - bySource
        - byEndDay
        - laterDays
        - viewport
        - keywords
      example:
        total: 28727
        locations: 456
        creators: 79
        timeline: { current: 27, passed: 7, upcoming: 28693 }
        byLanguage: { fr: 28100, en: 627 }
        bySource: { contribution: 879, shared: 0, aggregation: 27848 }
        byEndDay: { '2026-06-17': 12, '2026-06-18': 30 }
        laterDays: 28685
        viewport:
          topLeft: { latitude: 51.09, longitude: -5.14 }
          bottomRight: { latitude: 41.33, longitude: 9.56 }
        keywords: [Paris, Théâtre, Culture]
      properties:
        total:
          type: integer
          description: Total number of published events.
        locations:
          type: integer
          description: Distinct published-event locations (exact).
        creators:
          type: integer
          description: Distinct published-event creators (exact).
        timeline:
          type: object
          additionalProperties: false
          description: Event counts relative to now.
          required: [current, passed, upcoming]
          properties:
            current:
              type: integer
              description: Events happening now (started, not yet ended).
            passed:
              type: integer
              description: Events already ended.
            upcoming:
              type: integer
              description: Events not yet started.
        byLanguage:
          type: object
          description: Event count per language code.
          additionalProperties:
            type: integer
        bySource:
          type: object
          description: >
            Event count per add method (`contribution`, `shared`, `aggregation`).
            The three known methods are always present (0 when absent).
          additionalProperties:
            type: integer
        byEndDay:
          type: object
          description: >
            Per-day count of events ending within the next 30 days, keyed by
            `YYYY-MM-DD`. Use `laterDays` for the residual past that horizon.
          additionalProperties:
            type: integer
        laterDays:
          type: integer
          description: Count of events ending past the 30-day `byEndDay` horizon.
        viewport:
          oneOf:
            - $ref: '#/components/schemas/Viewport'
            - type: 'null'
          description: >
            Bounding box enclosing this scope's events with coordinates, or `null`
            when none has any.
        keywords:
          type: array
          description: >
            De-duplicated thematic terms (cities, departments, regions and
            keywords) characterising this scope's events.
          items:
            type: string

    AllEventStats:
      type: object
      additionalProperties: false
      description: >
        Statistics over an agenda's events of **any moderation state**
        (moderation and refused included) - `events.all`, with the
        per-moderation-state breakdown `byState`.
      required:
        - total
        - byState
        - timeline
        - byLanguage
        - bySource
        - byEndDay
        - laterDays
        - viewport
        - keywords
      example:
        total: 1248000
        byState: { '-1': 5000, '1': 200000, '2': 1043000 }
        timeline: { current: 30, passed: 900000, upcoming: 348000 }
        byLanguage: { fr: 1200000, en: 48000 }
        bySource: { contribution: 50000, shared: 12, aggregation: 1198000 }
        byEndDay: { '2026-06-17': 40 }
        laterDays: 347900
        viewport: null
        keywords: [Lyon, Concert]
      properties:
        total:
          type: integer
          description: Total number of events across all moderation states.
        byState:
          type: object
          description: >
            Event count per moderation state (`ModerationState` codes as keys).
          additionalProperties:
            type: integer
        timeline:
          type: object
          additionalProperties: false
          description: Event counts relative to now.
          required: [current, passed, upcoming]
          properties:
            current:
              type: integer
              description: Events happening now (started, not yet ended).
            passed:
              type: integer
              description: Events already ended.
            upcoming:
              type: integer
              description: Events not yet started.
        byLanguage:
          type: object
          description: Event count per language code.
          additionalProperties:
            type: integer
        bySource:
          type: object
          description: >
            Event count per add method (`contribution`, `shared`, `aggregation`).
            The three known methods are always present (0 when absent).
          additionalProperties:
            type: integer
        byEndDay:
          type: object
          description: >
            Per-day count of events ending within the next 30 days, keyed by
            `YYYY-MM-DD`. Use `laterDays` for the residual past that horizon.
          additionalProperties:
            type: integer
        laterDays:
          type: integer
          description: Count of events ending past the 30-day `byEndDay` horizon.
        viewport:
          oneOf:
            - $ref: '#/components/schemas/Viewport'
            - type: 'null'
          description: >
            Bounding box enclosing this scope's events with coordinates, or `null`
            when none has any.
        keywords:
          type: array
          description: >
            De-duplicated thematic terms (cities, departments, regions and
            keywords) characterising this scope's events.
          items:
            type: string

    RecentlyAddedStats:
      type: object
      additionalProperties: false
      description: >
        Published events whose `originAgenda` is this agenda, added within the
        last `window` days and with an occurrence still to begin, counted by add
        method. Identical for every caller.
      required: [window, bySource]
      example:
        window: 14
        bySource: { contribution: 12, shared: 0, aggregation: 3 }
      properties:
        window:
          type: integer
          description: >
            Width of the slice in days.
        bySource:
          type: object
          description: >
            Event count per add method (`contribution`, `shared`, `aggregation`).
          additionalProperties:
            type: integer

    AgendaOverview:
      type: object
      additionalProperties: false
      description: >
        Activity overview of one agenda, computed on each request: event
        volume, distributions, spatial extent and thematic keywords per
        visibility scope (`events.published` / `events.all`), plus the
        `recentlyAdded` slice. `events.published` (`PublishedEventStats`) is
        always present; `events.all` (`AllEventStats`) is present only for
        `administrator|moderator|internal` callers.
