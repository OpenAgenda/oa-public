            - width: 1080
              url: https://img.openagenda.com/u/1080x0/main/12345.full.image.jpg
        official: false
        private: false
        role: administrator
      required:
        - uid
        - slug
        - title
        - description
        - image
        - official
        - private
        - role
      properties:
        uid:
          type: integer
          format: int64
          readOnly: true
        slug:
          type: string
          readOnly: true
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        image:
