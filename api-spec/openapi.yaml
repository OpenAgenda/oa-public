  /agendas/{agendaUid}/uploads:
    post:
      operationId: agendas.uploads.create
      tags: [Uploads]
      summary: Stage a media upload
      x-synonyms: [upload, stage, attach, image, file, media]
      x-codeSamples:
        - lang: TypeScript
          label: Stage an image, then attach it to a new event
          source: |
            // 1. Upload the file to staging (multipart/form-data).
            const { data: staged, error } = await oa.agendas.uploads.create({
              path: { agendaUid: 12345 },
              body: { file }, // a Blob/File
            });
            if (error) throw error;

            // 2. Attach the ref on a normal event write.
            const created = await oa.agendas.events.create({
              path: { agendaUid: 12345 },
              body: {
                title: { fr: 'Concert' },
                description: { fr: 'Une soirée jazz.' },
                timings: [{ begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' }],
                location: { uid: 55512 },
                image: { ref: staged.ref },
              },
            });
            if (created.error) throw created.error;
            return created.data;
      description: >
        Stages a media file - the native event `image`, or a custom
        `file`/`image` form-schema field. Send the file as
        `multipart/form-data` (field `file`); the API validates its
        real type and size, stores it, and returns a short-lived `ref`.
        Then attach `ref` on an event write - `image: { ref }` or a
        custom field under `additionalFields` as `{ ref, name? }`
        (`name` being the download filename) - so the media lands in
        the same write as the rest of the edit.


        The type is detected from the file content, or from the
        filename extension for signature-less formats such as CSV; a
        type outside the platform's allowed set (images, PDF and common
        office documents) answers `422`. The file is capped at 20 MiB
        (`422` past it). This is a coarse gate: the precise types a
        given field accepts are enforced on the event write, against
        the agenda's form schema.
      security:
        - secretKey: []
        - oauth2:
            - media:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The media file to stage - an image, a PDF or another
                    platform-supported document.
      responses:
        '200':
          description: The staging reference to attach on an event write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /agendas/{agendaUid}/uploads/ticket:
    post:
      operationId: agendas.uploads.createTicket
      tags: [Uploads]
      summary: Authorize an out-of-band image upload
      x-synonyms:
        [
          upload,
          local file,
          attach image,
          photo,
          picture,
          ticket,
          out of band,
          no base64,
        ]
      x-codeSamples:
        - lang: TypeScript
          label: Attach a LOCAL image without base64
          source: |
            // 1. Authorize an out-of-band upload for the agenda.
            const { data: t, error } = await oa.agendas.uploads.createTicket({
              path: { agendaUid: 12345 },
            });
            if (error) throw error;

            // 2. Upload the LOCAL file OUT OF BAND — the bytes never pass through
            //    the model. Run this in your shell (e.g. Claude Code) or hand it
            //    to the user; it returns { ref: "staging/…" }:
            //    curl -sS -X POST "$UPLOAD_URL" \
            //      -H "X-Upload-Ticket: $TICKET" -F "file=@/path/to/image.jpg"
            //    (uploadUrl = t.uploadUrl, ticket = t.ticket)

            // 3. Attach the returned ref on a normal event write.
            const created = await oa.agendas.events.create({
              path: { agendaUid: 12345 },
              body: {
                title: { fr: 'Concert' },
                description: { fr: 'Une soirée jazz.' },
                timings: [
                  { begin: '2025-06-20T18:00:00+02:00', end: '2025-06-20T22:00:00+02:00' },
                ],
                location: { uid: 55512 },
                image: { ref: '<the ref returned by the upload>' },
              },
            });
            if (created.error) throw created.error;
            return created.data;
      description: >
        Authorizes an OUT-OF-BAND upload of a LOCAL image file, made
        from outside this API client (e.g. with curl), so its bytes
        never pass through the caller's prompt. Returns a
        self-contained descriptor: an `uploadUrl`, a short-lived single-use
        `ticket`, and the `header`/`field` to use.


        Upload the file with a plain HTTPS `POST` to `uploadUrl`: send
        the `ticket` in the `X-Upload-Ticket` header and the file as
        multipart field `file`. That call returns a staging `ref`,
        which you then attach with `image: { ref }` on an event write.


        An image already reachable at a public `http(s)` URL is
        attached directly with `image: { url }` on the write, with no
        ticket.


        The ticket expires after 5 minutes (`expiresAt`) and is
        consumed by a successful upload.
      security:
        - secretKey: []
        - oauth2:
            - media:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
      responses:
        '200':
          description: An out-of-band upload descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /uploads/staged:
    post:
      operationId: uploads.staged
      tags: [Uploads]
      summary: Upload a file with an upload ticket
      x-synonyms:
        [upload, out of band, ticket, staged, local file, raw bytes, no base64]
      x-codeSamples:
        - lang: Shell
          label: Upload the raw bytes out of band (curl)
          source: |
            # uploadUrl, ticket, header and field all come from
            # `agendas.uploads.createTicket`. The bytes go to the upload
            # endpoint, outside the API client and the caller's prompt.
            curl -sS -X POST "$UPLOAD_URL" \
              -H "X-Upload-Ticket: $TICKET" \
              -F "file=@/path/to/image.jpg"
            # -> { "ref": "staging/12345/…", "expiresAt": "…" }
      description: >
        Receives the bytes of an OUT-OF-BAND upload authorized by
        `agendas.uploads.createTicket`, and returns the staging `ref`
        to attach on an event write (`image: { ref }` or a custom
        `additionalFields` field). This is the endpoint the ticket
        descriptor's `uploadUrl` points at.


        Call it with a plain HTTPS `POST` from outside the typed API
        client, so the file never transits the client (or an LLM's
        token stream). Authorize with the ticket in the
        `X-Upload-Ticket` header (no API key or access token) and send
        the file as `multipart/form-data` field `file`. The target
        agenda is taken from the signed ticket.


        The type is detected from the file content, or from the
        filename extension for signature-less formats such as CSV; a
        type outside the platform's allowed set (images, PDF and common
        office documents) answers `422`. The file is capped at 20 MiB
        (`422` past it).


        A successful upload consumes the ticket: reusing it answers
        `401`. A request rejected before staging (`400`, `422`) leaves
        the ticket usable until it expires.
      security:
        - uploadTicketAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The media file to stage - an image, a PDF or another
                    platform-supported document.
      responses:
        '200':
          description: The staging reference to attach on an event write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agendas/{agendaUid}/locations:
    get:
      operationId: agendas.locations.list
      tags: [Locations]
      summary: List an agenda's locations
      x-synonyms: [venues, places, addresses, map, where, browse, all]
      x-codeSamples:
        - lang: TypeScript
          label: List the most recent locations
          source: |
            const { data, error } = await oa.agendas.locations.list({
              path: { agendaUid: 12345 },
              query: { limit: 20 },
            });
            if (error) throw error;
            return data.data.map((l) => ({ uid: l.uid, name: l.name }));
      description: >
        Returns a cursor-paginated list of the agenda's locations,
        newest first (insertion order, which can differ from
        `createdAt`). Pass the `after` cursor returned in
        `pagination.after` to fetch the next page, with the same
        filters.


        When the agenda shares its locations through a location set,
        the whole set is listed - including locations contributed by
        the other agendas of the set (their `setUid` carries the set's
        uid).


        Unknown or malformed filter values answer `400`, with per-field
        context under `error.errors`. An unrecognized top-level query parameter
        is ignored.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - locations:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Detailed'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/LocationSearch'
        - $ref: '#/components/parameters/LocationFilterUid'
        - $ref: '#/components/parameters/LocationFilterExtId'
        - $ref: '#/components/parameters/LocationBoundingBox'
        - $ref: '#/components/parameters/FilterCreatedAt'
        - $ref: '#/components/parameters/FilterUpdatedAt'
      responses:
        '200':
          description: A page of locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agendas/{agendaUid}/locations/ext/{extKey}/{extId}:
    get:
      operationId: agendas.locations.getByExtId
      tags: [Locations]
      summary: Get a single location by external id
      x-synonyms:
        [
          ext,
          external id,
          by ext,
          sync,
          source id,
          lookup,
          resolve,
          venue,
          place,
        ]
      x-codeSamples:
        - lang: TypeScript
          label: Resolve a location by the id it carries in a sync source
          source: |
            const { data, error } = await oa.agendas.locations.getByExtId({
              path: { agendaUid: 12345, extKey: 'my-system', extId: 'abc-123' },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a single location by its external identifier within the given
        agenda - the `(key, value)` pair an `ExtId` mapping carries in the
        location's `extIds`. Use this when you sync from your own system and
        hold its id rather than the OpenAgenda uid.
        Resolves to the same `Location` as the by-uid get.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - locations:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/ExtKey'
        - $ref: '#/components/parameters/ExtIdValue'
      responses:
        '200':
          description: The location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Agenda or location not found. A location merged into another one
            answers here too, and identifies the surviving one so a stale
            reference can be repaired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/MergedLocationError'
              examples:
                merged:
                  summary: Location merged into another one
                  value:
                    error:
                      code: merged
                      message: location merged into another location
                      mergedIn: 11111111
                notFound:
                  summary: Unknown location
                  value:
                    error:
                      code: not_found
                      message: location not found

  /agendas/{agendaUid}/locations/{locationUid}:
    get:
      operationId: agendas.locations.get
      tags: [Locations]
      summary: Get a location
      x-synonyms: [venue, place, address, detail]
      x-codeSamples:
        - lang: TypeScript
          label: Fetch one location
          source: |
            const { data, error } = await oa.agendas.locations.get({
              path: { agendaUid: 12345, locationUid: 67890 },
            });
            if (error) throw error;
            return data;
      description: >
        Returns a single location of the agenda (or of its shared location
        set) in the full `Location` shape.
      security:
        - publicKey: []
        - secretKey: []
        - oauth2:
            - locations:read
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/LocationUid'
      responses:
        '200':
          description: The location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Agenda or location not found. A location merged into another one
            answers here too, and identifies the surviving one so a stale
            reference can be repaired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/MergedLocationError'
              examples:
                merged:
                  summary: Location merged into another one
                  value:
                    error:
                      code: merged
                      message: location merged into another location
                      mergedIn: 11111111
                notFound:
                  summary: Unknown location
                  value:
                    error:
                      code: not_found
                      message: location not found

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >
        OAuth2 authorization code flow with PKCE (OAuth 2.1). Interactive
        clients redirect the user to the OpenAgenda authorization server to sign
        in and consent; the issued short-lived access token carries the granted
        scopes. PKCE (`S256`) is mandatory and public clients hold no secret.

        For machine-to-machine access, use an API key as a Bearer token instead.
      flows:
        authorizationCode:
          authorizationUrl: https://openagenda.com/api/auth/oauth2/authorize
          tokenUrl: https://openagenda.com/api/auth/oauth2/token
          refreshUrl: https://openagenda.com/api/auth/oauth2/token
          scopes:
            me:read: Read your profile, agendas and roles
            agendas:read: Read agendas and their configuration
            agendas:write: Create, configure and delete agendas
            events:read: Read events
            events:write: Create, edit and delete events
            drafts:read: Read your event drafts
            events:transverse: Search events across all agendas
            locations:read: Read locations
            locations:write: Create, edit, merge, transfer and delete locations
            geocoding:use: Turn addresses into coordinates, and back
            members:read: Read members and their personal data
            members:write: Invite, manage and contact members
            media:write: Upload files
            bookings:read: Read bookings
            conversations:write: Write in OpenAgenda messaging
    secretKey:
      type: http
      scheme: bearer
      description: >
        Secret API key (`oa_sk_…`) sent as a Bearer token. Server-side only: it
        carries the user identity the writes and `/me` need, and reads as well.
    publicKey:
      type: http
      scheme: bearer
      description: >
        Public API key (`oa_pk_…`) sent as a Bearer token. Read-only, and
        it carries no user identity: it reads what is public, an operation that
        writes answers `403` (`read_only_credential`) and one that needs an
        identity answers `401` - or `403` (`insufficient_scope`) when the key
        carries its own scopes and they exclude the operation. A per-agenda key
        reads the same way.
    uploadTicketAuth:
      type: apiKey
      in: header
      name: X-Upload-Ticket
      description: >
        A single-use, short-lived upload ticket, minted by
        `agendas.uploads.createTicket` and sent in the `X-Upload-Ticket` header.
        It authorizes staging exactly ONE file for the ONE agenda it is bound to,
        carries no account credential, and grants nothing beyond that single
        upload. Used only by `POST /uploads/staged`.
  parameters:
    AgendaUid:
      name: agendaUid
      in: path
      required: true
      description: Numeric uid of the agenda.
      schema:
        type: integer
        format: int64
    EventUid:
      name: eventUid
      in: path
      required: true
      description: Numeric uid of the event.
      schema:
        type: integer
        format: int64
    ExtKey:
      name: extKey
      in: path
      required: true
      description: >
        Name of the external system/source the identifier belongs to (the `key`
        of an `ExtId` mapping carried on the resource — an event or a location).
      schema:
        type: string
    ExtIdValue:
      name: extId
      in: path
      required: true
      description: >
        The resource's identifier within that external system (the `value` of an
        `ExtId` mapping carried in the resource's `extIds`). Percent-encode
        reserved characters.
      schema:
        type: string
    MergeExtIds:
      name: mergeExtIds
      in: query
      required: false
      description: >
        On the by-uid `PUT`, whether the body's `extIds` are merged by key with
        the ones already stored (`true`, the default) or replace them wholesale
        (`false`). A `PATCH` merges a non-empty `extIds` whatever this
        parameter says; an empty array clears the stored mappings.
      schema:
        type: boolean
        default: true
    AfterCursor:
      name: after
      in: query
      required: false
      description: >
        Opaque pagination cursor returned in `pagination.after` of the previous
        page. Omit it to fetch the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of items to return per page. An out-of-range or
        non-integer value is rejected with `400`, never clamped; use the `after`
        cursor to page further.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    Detailed:
      name: detailed
      in: query
      required: false
      description: >
        When `true`, each item in `data` is returned in its detailed
        representation, including the detailed-only fields. When `false` (the
        default), items are the lighter summary representation.
      schema:
        type: boolean
        default: false

    Fields:
      name: fields
      in: query
      required: false
      description: >
        Comma-separated list of fields to keep on each `data` item, to shrink
        the payload of large pages. When set, it selects the response shape
        directly over the resource's full field set, so `detailed` does not
        apply (it only governs the default shape when `fields` is omitted) and
        `fields` wins if both are given. `uid` is always returned. Each resource
        takes the names its own `data` item declares, and a dotted path descends
        one segment per level: on an event, `location.name` or `timings.begin`.
        An unknown top-level field is rejected with `400`, and so is an unknown
        sub-field under a closed object (`location.zzz`); under an open
        container - an `additionalFields` custom-field bag, on the resources
        that carry one, or a localized text map - any sub-key is accepted and
        yields nothing when absent (`additionalFields.myField`). Response
        schemas stay complete, so a generated client still types the omitted
        fields as present — read them as optional on this path.
      schema:
        type: array
        items:
          type: string
        example: [uid, slug]
      style: form
      explode: false

    AgendaSearch:
      name: search
      in: query
      required: false
      description: >
        Full-text search across agenda title and description. Wrap the value in
        double quotes for an exact phrase match.
      schema:
        type: string

    AgendaSort:
      name: sort
      in: query
      required: false
      description: >
        Sort order. When omitted, results are ranked by relevance if `search`
        is set, otherwise by `createdAt` descending. Set
        `recentlyAddedEvents.desc` to surface the agendas with the most recent
        activity first.
      schema:
        type: string
        enum:
          - createdAt.desc
          - recentlyAddedEvents.desc

    AgendaFilterUid:
      name: uid
      in: query
      required: false
      description: Restrict to these agenda uids. Repeat the parameter for multiple values.
      schema:
        type: array
        items:
          type: integer
          format: int64

    AgendaFilterSlug:
      name: slug
      in: query
      required: false
      description: Restrict to these agenda slugs. Repeat the parameter for multiple values.
      schema:
        type: array
        items:
          type: string

    AgendaFilterOfficial:
      name: official
      in: query
      required: false
      description: >
        Restrict to official agendas (`true`) or to non-official agendas
        (`false`). Omit to return both.
      schema:
        type: boolean

    LocationUid:
      name: locationUid
      in: path
      required: true
      description: Numeric uid of the location.
      schema:
        type: integer
        format: int64

    LocationSearch:
      name: search
      in: query
      required: false
      description: >
        Free-text search over the locations' name, address, city, region and
        department.
      schema:
        type: string

    LocationFilterUid:
      name: uid
      in: query
      required: false
      description: >
        Restrict to the given location uid(s). Repeat the parameter
        (`uid=123&uid=456`) for multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64

    LocationFilterExtId:
      name: extId
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Match a location by an external identifier:
        `extId[key]=<system>&extId[value]=<id>`. Both parts are required.
      schema:
        type: object
        additionalProperties: false
        required: [key, value]
        properties:
          key:
            type: string
          value:
            type: string

    LocationBoundingBox:
      name: bbox
      in: query
      required: false
      description: >
        Restrict to locations within a bounding box, given as
        `west,south,east,north` in decimal degrees (WGS84). Example:
        `bbox=2.224,48.815,2.469,48.902`.
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'

    Facets:
      name: facets
      in: query
      required: true
      description: >
        Comma-separated list of facets to compute over the filtered events.
        Unknown facet names return `400`. Each facet's result shape is defined
        by `FacetResults`. Bucket-list facets (the term, provenance and
        `locations` families) return the top buckets by event count, capped by
        `facetSize` (overridable per facet with `facetSizes[<facet>]`) and
        reordered by `facetSort`; past the cap, narrow the filter.
        `additionalFields` and `additionalFieldMetrics` cover the agenda's own
        fields as its event form schema declares them
        (`GET /agendas/{agendaUid}/events/schema`), named by
        `additionalFieldsKeys`/`additionalFieldMetricsKeys` or all readable
        fields when omitted; `additionalFields` returns one bucket per option.
        `timings` bucket width is set by `timingsInterval`, the `dateRanges`
        month by `month`, `geohash` granularity by `geohashZoom`.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - additionalFields
            - additionalFieldMetrics
            - cities
            - regions
            - departments
            - districts
            - countryCodes
            - keywords
            - languages
            - accessibilities
            - status
            - attendanceModes
            - originAgendas
            - sourceAgendas
            - locations
            - geohash
            - viewport
            - timespan
            - timings
            - dateRanges

    FacetSize:
      name: facetSize
      in: query
      required: false
      description: >
        Default maximum number of buckets for the bucket-list facets (the term,
        provenance and `locations` families), ordered by event count. Override
        a single facet with `facetSizes[<facet>]`. Out-of-range values are
        clamped; other facets ignore it.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 250

    FacetSizes:
      name: facetSizes
      in: query
      required: false
      description: >
        Per-facet override of `facetSize`, keyed by facet name
        (`facetSizes[cities]=50`). Precedence: per-facet override > `facetSize`
        > default (10). Only applies to bucket-list facets; values are clamped
        to [1, 250].
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: integer
          minimum: 1
          maximum: 250

    FacetSort:
      name: facetSort
      in: query
      required: false
      description: >
        Default ordering of the bucket-list facets. `count` (default) returns
        the most frequent buckets first; `alpha` returns the same top-`facetSize`
        buckets but ordered alphabetically by their display value (city/keyword
        name, location name, agenda title) for readable scanning. Override a
        single facet with `facetSorts[<facet>]`.
      schema:
        type: string
        default: count
        enum:
          - count
          - alpha

    FacetSorts:
      name: facetSorts
      in: query
      required: false
      description: >
        Per-facet override of `facetSort`, keyed by facet name
        (`facetSorts[cities]=alpha`). Precedence: per-facet override >
        `facetSort` > default (`count`).
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
          enum:
            - count
            - alpha

    FacetMissing:
      name: facetMissing
      in: query
      required: false
      description: >
        Per-facet label for a synthetic bucket counting the filtered events that
        have **no value** for the facet's field
        (`facetMissing[district]=Unknown` adds an `{ value: "Unknown", count }`
        bucket). Honoured by the term facets (those whose buckets are keyed by
        the displayed value) except `accessibilities`; ignored by the
        provenance, `locations` and remaining families. The bucket appears only
        when such events exist.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string

    GeohashZoom:
      name: geohashZoom
      in: query
      required: false
      description: >
        Clustering zoom level for the `geohash` facet (higher = finer grid, more
        clusters). Ignored unless `geohash` is requested.
      schema:
        type: integer
        default: 1
        minimum: 1

    TimingsInterval:
      name: timingsInterval
      in: query
      required: false
      description: >
        Bucket width for the `timings` date histogram. Ignored unless `timings`
        is requested; an unrecognized value falls back to `day`.
      schema:
        type: string
        default: day
        enum:
          - hour
          - day
          - week
          - month
          - year

    Month:
      name: month
      in: query
      required: false
      description: >
        Calendar month (`YYYY-MM`) the `dateRanges` facet buckets day-by-day.
        Defaults to the current month; an unrecognized value falls back to it.
        Ignored unless `dateRanges` is requested. Because it bounds the buckets
        by scoping the filtered set to that month, it also constrains any other
        facet requested in the same call.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'

    AdditionalFieldsKeys:
      name: additionalFieldsKeys
      in: query
      required: false
      description: >
        Comma-separated agenda choice/boolean field names to compute the
        `additionalFields` facet on — the names the agenda's event form schema
        declares (`GET /agendas/{agendaUid}/events/schema`). Omit to get every
        such field readable at the caller's access level. An unknown or
        non-readable field name returns `400`. Ignored unless `additionalFields`
        is requested.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string

    AdditionalFieldMetricsKeys:
      name: additionalFieldMetricsKeys
      in: query
      required: false
      description: >
        Comma-separated agenda numeric field names to compute the
        `additionalFieldMetrics` facet on — the names the agenda's event form
        schema declares (`GET /agendas/{agendaUid}/events/schema`). Omit to get
        every numeric field readable at the caller's access level. An unknown or
        non-readable field name returns `400`. Ignored unless
        `additionalFieldMetrics` is requested.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string

    Sort:
      name: sort
      in: query
      required: false
      description: >
        Ordering of the results. Defaults to `timingsWithFeatured.asc`, or to
        `score` (relevance) when `search` is set and no `sort` is given.
      schema:
        type: string
        enum:
          - timings.asc
          - timingsWithFeatured.asc
          - lastTiming.asc
          - lastTimingWithFeatured.asc
          - updatedAt.asc
          - updatedAt.desc
          - location.name.asc
          - location.name.desc
          - location.city.asc
          - location.city.desc
          - score
        x-enum-descriptions:
          timings.asc: By event date, earliest first
          timingsWithFeatured.asc: By event date, featured events first
          lastTiming.asc: By last occurrence date, earliest first
          lastTimingWithFeatured.asc: By last occurrence, featured events first
          updatedAt.asc: Least recently updated first
          updatedAt.desc: Most recently updated first
          location.name.asc: By location name, A→Z
          location.name.desc: By location name, Z→A
          location.city.asc: By city, A→Z
          location.city.desc: By city, Z→A
          score: By search relevance (only meaningful with `search`)

    Search:
      name: search
      in: query
      required: false
      description: >
        Full-text search across title, description, keywords and address.
        Wrap the value in double quotes for an exact phrase match.
      schema:
        type: string

    RelevanceThreshold:
      name: threshold
      in: query
      required: false
      description: >
        Relevance score floor for `search` results, used to drop weakly-matching
        events from the long tail (e.g. a single query term buried in a long
        description). Ignored when `search` is not set. `off` (the default)
        returns every match. `auto` derives the floor from the score
        distribution of the current query: the largest relative drop ("elbow")
        in the top scores becomes the cutoff, so it adapts to each query. A
        non-negative number is an absolute minimum score; relevance scores are
        specific to a query, so a fixed value suits a single tuned query rather
        than general use - prefer `auto`. The cutoff applies before counting, so
        the returned events, their `total` and the facet counts describe the
        same trimmed set; pass the same `threshold` to the facets endpoint to
        keep its counts aligned with the list.
      schema:
        # Quote the string barewords: unquoted `off` is coerced to boolean false
        # by YAML 1.1 tooling (PyYAML, some codegens), diverging from the runtime
        # string. (The server also accepts a falsy `false`/"false" as `off`.)
        default: 'off'
        oneOf:
          - type: string
            enum: ['off', 'auto']
          - type: number
            minimum: 0

    FilterUid:
      name: uid
      in: query
      required: false
      description: Restrict to these event uids. Repeat the parameter for multiple values.
      schema:
        type: array
        items:
          type: integer
          format: int64

    FilterSlug:
      name: slug
      in: query
      required: false
      description: Restrict to these event slugs. Repeat the parameter for multiple values.
      schema:
        type: array
        items:
          type: string

    FilterExtId:
      name: extId
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Match an event by an external identifier:
        `extId[key]=<system>&extId[value]=<id>`.
      schema:
        type: object
        additionalProperties: false
        required: [key, value]
        properties:
          key:
            type: string
          value:
            type: string

    FilterKeyword:
      name: keyword
      in: query
      required: false
      description: >
        Restrict to events tagged with these keywords. Repeating the parameter
        narrows the result set (AND semantics).
      schema:
        type: array
        items:
          type: string

    FilterLanguage:
      name: language
      in: query
      required: false
      description: Restrict to events in these languages (ISO 639-1 codes).
      schema:
        type: array
        items:
          type: string

    FilterAccessibility:
      name: accessibility
      in: query
      required: false
      description: Restrict to events offering these accessibility facilities.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AccessibilityCode'

    FilterStatus:
      name: status
      in: query
      required: false
      description: Restrict to these statuses.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventStatus'

    FilterAttendanceMode:
      name: attendanceMode
      in: query
      required: false
      description: Restrict to these attendance modes.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AttendanceMode'

    FilterFeatured:
      name: featured
      in: query
      required: false
      description: Restrict to featured (`true`) or non-featured (`false`) events.
      schema:
        type: boolean

    FilterLocationUid:
      name: locationUid
      in: query
      required: false
      description: Restrict to events held at these location uids.
      schema:
        type: array
        items:
          type: integer
          format: int64

    FilterLocationExtId:
      name: locationExtId
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Match by a location external identifier:
        `locationExtId[key]=<system>&locationExtId[value]=<id>`.
      schema:
        type: object
        additionalProperties: false
        required: [key, value]
        properties:
          key:
            type: string
          value:
            type: string

    FilterRegion:
      name: region
      in: query
      required: false
      description: Restrict to events located in these regions.
      schema:
        type: array
        items:
          type: string

    FilterDepartment:
      name: department
      in: query
      required: false
      description: Restrict to events located in these departments.
      schema:
        type: array
        items:
          type: string

    FilterCity:
      name: city
      in: query
      required: false
      description: Restrict to events located in these cities.
      schema:
        type: array
        items:
          type: string

    FilterDistrict:
      name: district
      in: query
      required: false
      description: Restrict to events located in these districts.
      schema:
        type: array
        items:
          type: string

    FilterAdminLevel3:
      name: adminLevel3
      in: query
      required: false
      description: Restrict to events located in these level-3 administrative areas.
      schema:
        type: array
        items:
          type: string

    FilterAdminLevel5:
      name: adminLevel5
      in: query
      required: false
      description: Restrict to events located in these level-5 administrative areas.
      schema:
        type: array
        items:
          type: string

    FilterCountryCode:
      name: countryCode
      in: query
      required: false
      description: Restrict to events located in these countries (ISO 3166-1 alpha-2).
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Za-z]{2}$'

    FilterBoundingBox:
      name: bbox
      in: query
      required: false
      description: >
        Restrict to events whose location falls within a bounding box, given as
        `west,south,east,north` in decimal degrees (WGS84). Example:
        `bbox=2.224,48.815,2.469,48.902`.
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'

    FilterNear:
      name: near
      in: query
      required: false
      description: >
        Center of a proximity search, given as `latitude,longitude` in decimal
        degrees. Must be combined with `radius`.
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?$'

    FilterRadius:
      name: radius
      in: query
      required: false
      description: >
        Proximity radius in metres around `near`. Requires `near` to be set.
      schema:
        type: integer
        minimum: 1

    FilterOriginAgendaUid:
      name: originAgendaUid
      in: query
      required: false
      description: Restrict to events originally created in these agendas.
      schema:
        type: array
        items:
          type: integer
          format: int64

    FilterOriginAgendaOfficial:
      name: originAgendaOfficial
      in: query
      required: false
      description: Restrict to events whose origin agenda is official (`true`) or not (`false`).
      schema:
        type: boolean

    FilterSourceAgendaUid:
      name: sourceAgendaUid
      in: query
      required: false
      description: Restrict to events aggregated from these source agendas.
      schema:
        type: array
        items:
          type: integer
          format: int64

    FilterRelative:
      name: relative
      in: query
      required: false
      description: >
        Restrict by temporal position relative to now. Combine values (repeat
        the parameter) to widen the window: `passed`, `upcoming`, `current`.
      schema:
        type: array
        items:
          type: string
          enum: [passed, upcoming, current]

    FilterTimings:
      name: timings
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Restrict to events having a timing that begins within the range, as
        RFC 3339 date-times: `timings[gte]=…&timings[lte]=…`. For now-relative
        windows, prefer `relative`. Date-times must carry an explicit offset
        (e.g. `Z`); a bare date (`YYYY-MM-DD`) is read as UTC midnight.
      schema:
        type: object
        additionalProperties: false
        properties:
          gte:
            type: string
            format: date-time
          lte:
            type: string
            format: date-time

    FilterLocalTime:
      name: localTime
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Restrict to events with a timing starting within a daily time window,
        in minutes from local midnight: `localTime[gte]=480` (08:00) and/or
        `localTime[lte]=1200` (20:00).
      schema:
        type: object
        additionalProperties: false
        properties:
          gte:
            type: integer
            minimum: 0
            maximum: 1440
          lte:
            type: integer
            minimum: 0
            maximum: 1440

    FilterCreatedAt:
      name: createdAt
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Restrict by creation date, as RFC 3339 date-times:
        `createdAt[gte]=…&createdAt[lte]=…`. Date-times must carry an
        explicit offset (e.g. `Z`); a bare date (`YYYY-MM-DD`) is read as
        UTC midnight.
      schema:
        type: object
        additionalProperties: false
        properties:
          gte:
            type: string
            format: date-time
          lte:
            type: string
            format: date-time

    FilterUpdatedAt:
      name: updatedAt
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Restrict by last-update date, as RFC 3339 date-times:
        `updatedAt[gte]=…&updatedAt[lte]=…`. Useful for incremental sync.
        Date-times must carry an explicit offset (e.g. `Z`); a bare date
        (`YYYY-MM-DD`) is read as UTC midnight.
      schema:
        type: object
        additionalProperties: false
        properties:
          gte:
            type: string
            format: date-time
          lte:
            type: string
            format: date-time

    FilterAge:
      name: age
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Restrict to events whose intended audience age range overlaps the given
        bounds, in years: `age[gte]=7&age[lte]=12`.
      schema:
        type: object
        additionalProperties: false
        properties:
          gte:
            type: integer
            minimum: 0
          lte:
            type: integer
            minimum: 0

    FilterAdditionalFields:
      name: additionalFields
      in: query
      required: false
      style: deepObject
      explode: true
      description: >
        Filter on agenda-specific additional fields, addressed by field name:
        `additionalFields[<fieldName>]=<value>`. Available fields and their value
        types come from the agenda's event form schema
        (`GET /agendas/{agendaUid}/events/schema`). For numeric fields, use
        a range object:
        `additionalFields[<fieldName>][gte]=…&additionalFields[<fieldName>][lte]=…`.
      schema:
        type: object
        additionalProperties:
          x-additionalPropertiesName: fieldName

  responses:
    BadRequest:
      description: >
        Malformed request: the body is not valid JSON, it carries a field the
        operation does not accept, or a recognized parameter carries an
        invalid value. `error.errors`, when present, names the offending
        values.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: >-
        The request carries no credential this operation accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        Authenticated, but not allowed to access this resource. A blacklisted
        account is refused like a member the agenda does not allow to perform
        the operation. On an `insufficient_scope` refusal a `WWW-Authenticate:
        Bearer error="insufficient_scope", scope="<required>"` header names the
        missing scope (RFC 6750 §3.1); an API key carries scopes only when it
        declares its own permissions.
      headers:
        WWW-Authenticate:
          description: >-
            Present on an `insufficient_scope` failure: the RFC 6750 Bearer
            challenge naming the scope the token must hold.
          required: false
          schema:
            type: string
          example: >-
            Bearer error="insufficient_scope", scope="events:read",
            error_description="the access token lacks the required scope"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No resource answers this identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: >-
        The request was well-formed but its field values failed validation
        (e.g. a missing title, an invalid timing, an unknown location uid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ServiceUnavailable:
      description: >-
        The request was not processed and can be retried after a short
        delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: A refused request, carrying nothing but the reason.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              enum:
                [
                  bad_request,
                  unauthorized,
                  read_only_credential,
                  insufficient_scope,
                  forbidden,
                  not_found,
                  service_unavailable,
                ]
              x-enum-descriptions:
                read_only_credential: >-
                  403 - the credential may only read, and this operation writes
                insufficient_scope: >-
                  403 - the credential lacks the scope this operation declares
                forbidden: 403 - any other refusal of an authenticated caller
            message:
              type: string
              description: Human-readable explanation.

    ValidationError:
      type: object
      description: A request refused because of the values it carries.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, errors]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              enum: [validation_error, bad_request]
            message:
              type: string
              description: Human-readable explanation.
            errors:
              type: array
              description: The problems found in the request, one per value.
              minItems: 1
              items:
                $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      description: >-
        One problem found in a request. A validator describes the values it
        refuses as precisely as it can, so an item carries the keys below plus
        whatever else that validator knows, such as the rejected value or the
        bounds it had to satisfy.
      required: [message]
      properties:
        field:
          type: string
          description: >-
            Name of the offending value in the request. It is absent when the
            problem belongs to no single value.
          examples: ['title', 'description', 'timings', 'image.url']
        lang:
          type: string
          description: Language key of the offending value, on a localized field.
        index:
          type: integer
          description: Position of the offending value, in a list field.
        code:
          type: string
          description: Stable, machine-readable reason for the refusal.
          examples: ['required', 'string.toolong', 'email.invalid']
        message:
          type: string
          description: Human-readable explanation, in English.

    ValidationVerdict:
      type: object
      description: >-
        The verdict of a dry run, reached when validation found nothing to
        refuse.
      required: [valid]
      additionalProperties: false
      properties:
        valid:
          type: boolean
          enum: [true]

    MergedLocationError:
      type: object
      description: >-
        An error response for a location that was merged into another one.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, mergedIn]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              enum: [merged]
            message:
              type: string
              description: Human-readable explanation.
            mergedIn:
              type: integer
              description: Uid of the location this one was merged into.

    Pagination:
      type: object
      description: >-
        Where a page of results stops, and how to ask for the next one.
      required: [after, limit]
      additionalProperties: false
      example:
        after: eyJ1aWQiOjIzNDU2fQ
        limit: 20
        total: 342
        totalRelation: exact
      properties:
        after:
          type: [string, 'null']
          description: >
            Opaque cursor to fetch the next page (pass back as the `after`
            query parameter). `null` when there are no more results; a full
            last page can still carry a cursor whose next page is empty.
        limit:
          type: integer
          description: The page size that was applied.
        total:
          type: integer
          description: >
            Total number of matching records, when the operation counts them.
        totalRelation:
          type: string
          enum: [exact, atLeast]
          description: >
            Whether `total` is the exact count (`exact`) or a lower bound
            (`atLeast`). Very large result sets are counted only up to a limit;
            past it `total` is the floor, not the precise number. Present
            whenever `total` is.

    LocalizedString:
      type: object
      description: >
        A string localized per language, keyed by ISO 639-1 code (e.g. `fr`,
        `en`).
      additionalProperties:
        type: string
        x-additionalPropertiesName: languageCode
      examples:
        - fr: 'Concert de jazz'
          en: 'Jazz concert'

    LocalizedStringArray:
      type: object
      description: A list of strings localized per language code (used for keywords).
      additionalProperties:
        type: array
        x-additionalPropertiesName: languageCode
        items:
          type: string

    Image:
      type: object
      description: >
        Image of an event, an agenda or a location, rendered on demand from a
        single source. Use `src` as a ready-to-use default rendition, or drive
        a responsive picture: substitute a geometry into `srcTemplate` or pick a
        ready-made width from `srcset`. `width`/`height` are the source
        dimensions, which cap every rendition.
      additionalProperties: false
      required: [width, height, src, srcTemplate, srcset]
      properties:
        width:
          type: [integer, 'null']
          description: Intrinsic width of the source image, in pixels.
        height:
          type: [integer, 'null']
          description: Intrinsic height of the source image, in pixels.
        src:
          type: [string, 'null']
          format: uri
          description: >
            Ready-to-use default rendition URL (a naive `<img src>` just works).
        srcTemplate:
          type: [string, 'null']
          description: >
            URL with a `{geo}` placeholder to substitute with a geometry, to
            render the image at any size. Supported geometries: `{W}x{H}`, where
            `0` on an axis means proportional to the other (e.g. `800x0`);
            append `/smart` to crop on the detected point of interest rather
            than the centre, or prefix `fit-in/` to contain the image instead of
            cropping it (e.g. `300x300`, `300x300/smart`, `fit-in/1000x1000`).
            `null` when no rendition can be derived - use `src` as is.
        srcset:
          type: array
          description: Ready-made proportional widths, never upscaled past the source.
          items:
            type: object
            additionalProperties: false
            properties:
              width:
                type: integer
              url:
                type: string
                format: uri

    EventLocation:
      type: object
      description: >
        The location snapshot an event carries - a nullable subset of the
        `Location` record. The canonical, full record is the `Location`
        resource (`GET /agendas/{agendaUid}/locations/{locationUid}`, same
        `uid`).
      additionalProperties: false
      properties:
        uid:
          type: integer
          format: int64
          readOnly: true
        name:
          type: [string, 'null']
        address:
          type: [string, 'null']
        city:
          type: [string, 'null']
        region:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
        countryCode:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country code.
        latitude:
          type: [number, 'null']
          format: double
        longitude:
          type: [number, 'null']
          format: double
        district:
          type: [string, 'null']
        department:
          type: [string, 'null']
        adminLevel3:
          type: [string, 'null']
        adminLevel5:
          type: [string, 'null']
        country:
          oneOf:
            - $ref: '#/components/schemas/LocalizedString'
            - type: 'null'
          description: Localized country label.
        timezone:
          type: [string, 'null']
          description: IANA time zone of the location.

    LocationSummary:
      type: object
      description: >
        Compact location representation returned by the list endpoint
        (`detailed: false`) — identity, coordinates and verification status
        only; fetch with `detailed=true` or the single-location get for the
        full record.
      additionalProperties: false
      example:
        uid: 67890
        name: Château des Lèbres
        address: Naves, 07140 Les Vans
        latitude: 44.388303
        longitude: 4.105528
        verified: true
      required:
        - uid
        - name
        - address
        - latitude
        - longitude
        - verified
      properties:
        uid:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        address:
          type: [string, 'null']
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        verified:
          type: boolean
          description: Whether the location was verified by an agenda moderator.

    Location:
      type: object
      description: >
        Full location representation returned by the single-get endpoint and
        by the list when `detailed=true` — the canonical record (the events'
        embedded `EventLocation` is a nullable snapshot of it).
      additionalProperties: false
      example:
        uid: 67890
        slug: chateau-des-lebres_4421007
        setUid: null
        name: Château des Lèbres
        address: Naves, 07140 Les Vans
        city: Les Vans
        district: null
        region: Auvergne-Rhône-Alpes
        department: Ardèche
        adminLevel3: null
        adminLevel5: null
        postalCode: '07140'
        insee: '07334'
        countryCode: FR
        latitude: 44.388303
        longitude: 4.105528
        timezone: Europe/Paris
        description:
          fr: Ancienne maison forte des comtes du Roure.
        access: {}
        image:
          width: 1200
          height: 800
          src: https://img.openagenda.com/u/1080x0/main/67890.full.image.jpg
          srcTemplate: https://img.openagenda.com/u/{geo}/main/67890.full.image.jpg
          srcset:
            - width: 640
              url: https://img.openagenda.com/u/640x0/main/67890.full.image.jpg
            - width: 1080
              url: https://img.openagenda.com/u/1080x0/main/67890.full.image.jpg
        imageCredits: null
        website: http://www.domainedeslebres.com/
        email: null
        phone: '0475363414'
        links:
          - https://fr-fr.facebook.com/domainedeslebres/
        extIds:
          - key: legacy
            value: '4421007'
        additionalFields:
          tags:
            - id: 2
              label: Château, hôtel urbain, palais, manoir
        siret: null
        verified: true
        createdAt: '2017-10-30T14:21:07.000Z'
        updatedAt: '2019-04-29T15:40:33.000Z'
      required:
        - uid
        - slug
        - setUid
        - name
        - address
        - city
        - district
        - region
        - department
        - adminLevel3
        - adminLevel5
        - postalCode
        - insee
        - countryCode
        - latitude
        - longitude
        - timezone
        - description
        - access
        - image
        - imageCredits
        - website
        - email
        - phone
        - links
        - extIds
        - additionalFields
        - siret
        - verified
        - createdAt
        - updatedAt
      properties:
        uid:
          type: integer
          format: int64
          readOnly: true
        slug:
          type: string
          readOnly: true
        setUid:
          type: [integer, 'null']
          format: int64
          readOnly: true
          description: >
            Uid of the shared location set this location belongs to, or `null`
            when it belongs to a single agenda's own pool.
        name:
          type: string
        address:
          type: [string, 'null']
        city:
          type: [string, 'null']
        district:
          type: [string, 'null']
        region:
          type: [string, 'null']
        department:
          type: [string, 'null']
        adminLevel3:
          type: [string, 'null']
        adminLevel5:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
        insee:
          type: [string, 'null']
          description: INSEE code of the French municipality, when known.
        countryCode:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country code.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        timezone:
          type: [string, 'null']
          description: IANA time zone of the location.
        description:
          $ref: '#/components/schemas/LocalizedString'
        access:
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
          description: >
            Localized practical information on how to reach the location.
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        imageCredits:
          type: [string, 'null']
        website:
          type: [string, 'null']
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        links:
          type: array
          items:
            type: string
        extIds:
          type: array
          items:
            $ref: '#/components/schemas/LocationExtId'
        additionalFields:
          $ref: '#/components/schemas/LocationAdditionalFields'
        siret:
          type: [string, 'null']
          description: >-
            SIRET number (French establishment id) of the location's
            operator, when provided.
        verified:
          type: boolean
          description: Whether the location was verified by an agenda moderator.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    LocationExtId:
      type: object
      description: >
        An external identifier mapping this location to a third-party system.
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: [string, 'null']

    LocationAdditionalFields:
      type: object
      description: >
        Agenda-specific additional fields of the location, keyed by field name.
        `tags` carries the location's tags, filtered against the tag set
        declared in the agenda's schema.
      properties:
        tags:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: integer
              label:
                description: >
                  Display label of the tag — a plain string or a localized
                  map, as stored.
                oneOf:
                  - type: string
                  - $ref: '#/components/schemas/LocalizedString'
      additionalProperties:
        x-additionalPropertiesName: fieldName

    LocationList:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          description: >
            `LocationSummary` items by default, or full `Location` items when
            `detailed=true`.
          items:
            # Detailed branch FIRST: order is irrelevant to JSON Schema (the
            # branches are mutually exclusive) but the generated zod client
            # returns the first match and strips unknown keys — summary-first
            # would silently strip the detailed-only fields. Same rule on every
            # summary/detailed pair.
            oneOf:
              - $ref: '#/components/schemas/Location'
              - $ref: '#/components/schemas/LocationSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    EventFormSchema:
      type: object
      description: The event form an agenda declares.
      required: [fields]
      # Served raw from the form engine: top-level keys beyond `fields` may
      # appear (engine vocabulary); only `fields` is contractual.
      additionalProperties: true
      properties:
        fields:
          type: array
          description: >
            The fields of the merged schema readable at the caller's access
            level - native event fields (with any per-agenda overrides applied)
            and the agenda's/network's additional fields (`schemaId` non-null).
            A field whose `read` access levels exclude the caller is omitted.
          items:
            $ref: '#/components/schemas/FormSchemaField'

    FormSchemaField:
      type: object
      description: >
        A form field descriptor. Two kinds share the array: **data field
        descriptors** (carrying `field`, the key the value lives under on
        events) and **section separators** (`type: 'section'`, no `field` -
        structure the form into titled groups). Descriptors may carry keys
        beyond those listed below.
      additionalProperties: true
      example:
        field: thematique
        fieldType: radio
        label: { fr: 'Thématique', en: 'Theme' }
        schemaId: 10522
        schemaType: agenda
        options:
          - id: 42
            value: concert
            label: { fr: 'Concert' }
      properties:
        field:
          type: string
          description: >
            Field name — the key the value is carried under on events. Absent
            on section separators.
        fieldType:
          type: string
          description: >
            Field kind, which sets the shape of the value (e.g. `text`,
            `radio`, `number`, `image`).
        type:
          type: string
          description: >
            Descriptor kind marker - `section` for section separators.
        slug:
          type: string
          description: Stable identifier of a section separator.
        label:
          description: Localized display label, when the descriptor carries one.
          oneOf:
            - $ref: '#/components/schemas/LocalizedString'
            - type: string
            - type: 'null'
        optional:
          type: boolean
          description: >
            `false` means the field is required (possibly a per-agenda
            override of a native field).
        display:
          description: Whether the field is shown on the form (default true).
        enable:
          type: boolean
          description: Whether the field is enabled (default true).
        enableWith:
          description: >
            The field is only active when another field has a value: either
            that field's name, or `{ field, value }` to require specific
            values (e.g. `onlineAccessLink` enabled when `attendanceMode` is
            online or mixed).
        optionalWith:
          description: >
            The field is optional when another field has a value (either that
            field's name, or `{ field, value }` to require specific values) and
            required otherwise; an explicit `optional` takes precedence.
        origin:
          type: [string, 'null']
          enum: [tags, categories, custom, null]
          description: >
            Set on a field converted from an earlier agenda setting: what it was
            converted from.
        options:
          type: array
          description: Allowed choices for choice-like field kinds.
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: integer
              value:
                type: string
              label:
                oneOf:
                  - $ref: '#/components/schemas/LocalizedString'
                  - type: string
        schemaId:
          type: [integer, 'null']
          description: >
            Identifier of the declaring agenda/network schema. Non-null marks
            an **additional field**; `null`/absent marks a native one.
        schemaType:
          type: [string, 'null']
          enum: [agenda, network, event, null]
          description: >
            Which level declared the field: `agenda`/`network` for additional
            fields, `event` for the platform's native event fields.

    MemberRole:
      type: string
      enum: [administrator, moderator, contributor, reader]
      x-enum-descriptions:
        administrator: Full control of the agenda, its settings and members
        moderator: Moderates contributed events and manages content
        contributor: Can contribute events to the agenda
        reader: Read-only member

    MeAgendaItem:
      type: object
