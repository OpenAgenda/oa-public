      tags: [Events]
      summary: Delete an event by external id
      x-synonyms: [delete, remove, destroy, by ext, sync]
      x-codeSamples:
        - lang: TypeScript
          label: Delete an event addressed by its sync id
          source: |
            const { data, error } = await oa.agendas.events.deleteByExtId({
              path: { agendaUid: 12345, extKey: 'my-system', extId: 'abc-123' },
            });
            if (error) throw error;
            return data.deleted; // true
      description: >
        Resolves the event carrying the `(extKey, extId)` pair and
        removes it. When the agenda is the event's origin this deletes
        the event; otherwise it de-references it from this agenda (the
        origin keeps it). Answers `200` with a `DeletionResult`
        carrying the resolved uid.


        The acting member must be allowed to remove the event,
        otherwise `403`. An unknown pair answers `404`.
      security:
        - secretKey: []
        - oauth2:
            - events:write
      parameters:
        - $ref: '#/components/parameters/AgendaUid'
        - $ref: '#/components/parameters/ExtKey'
        - $ref: '#/components/parameters/ExtIdValue'
      responses:
        '200':
          description: The event was removed from this agenda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

