    # the labels never drift between the two.
    EventStatus:
      type: integer
      enum: [1, 2, 3, 4, 5, 6]
      description: Lifecycle status of the event.
      x-enum-descriptions:
        '1': Scheduled
        '2': Rescheduled
        '3': Moved online
        '4': Postponed
        '5': Full
        '6': Cancelled
    AttendanceMode:
      type: integer
      enum: [1, 2, 3]
      description: How attendees take part.
      x-enum-descriptions:
        '1': Offline (on-site)
        '2': Online
        '3': Mixed (on-site and online)
    ModerationState:
      type: integer
      enum: [-2, -1, 0, 1, 2]
      description: Moderation state of the event.
      x-enum-descriptions:
        '-2': Removed
        '-1': Refused
        '0': To control
        '1': Controlled
        '2': Published
